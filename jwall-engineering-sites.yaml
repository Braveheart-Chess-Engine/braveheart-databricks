# jwall-engineering-sites project file: a Databricks workspace for Braveheart.
# The VPC range, cost center, compute policies it may use and the workspace
# admins are set centrally (projects.braveheart-databricks.databricks in config.yaml).
# Fields and behaviour:
# https://github.com/jwallace145/jwall-engineering-infra/blob/main/docs/databricks.md#the-project-file
version: 1
project: braveheart-databricks
repository: jwallace145/braveheart-databricks

# Project, Repository and Environment=prod are cross-checked; the CLI adds
# ManagedBy, CostCenter and Workspace itself.
tags:
  Organization: jwall-engineering
  Project: braveheart-databricks
  Environment: prod
  Repository: jwallace145/braveheart-databricks
  Owner: jwallace145

components:
  - kind: databricks-workspace
    compute_policies: [small-interactive, jobs]
    # Workspace users, by email. Each must already be a Databricks account user.
    # Admins stay central (config.yaml); an admin listed here is refused.
    # Changes take effect on the next Databricks plan/apply after merging to main.
    users: []

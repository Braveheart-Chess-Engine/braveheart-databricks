# Local git hooks. Install once with `pre-commit install --hook-type commit-msg --hook-type pre-commit`.
# CI is the authoritative check; these hooks exist so that mistakes are caught
# before they are pushed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (one-line Conventional Commit)
        entry: npx --no-install commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
